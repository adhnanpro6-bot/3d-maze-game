<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070c" />
  <title>3D Maze Puzzle Challenge</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 1. ACCESS GATE SCREEN -->
  <div id="access-screen" class="overlay-screen">
    <div class="card">
      <h1>3D MAZE PUZZLE CHALLENGE</h1>
      <p class="subtitle">5 വാതിലുകൾ കടന്ന് എക്സിറ്റിൽ എത്തുക</p>

      <label for="player-name">കളിക്കാരന്റെ പേര്</label>
      <input id="player-name" type="text" placeholder="നിങ്ങളുടെ പേര് നൽകുക" autocomplete="off" />

      <label for="access-code">ആക്സസ് കോഡ്</label>
      <input id="access-code" type="text" placeholder="ഉദാ: KKMQZN01-7842" autocomplete="off" />

      <button id="start-btn" type="button">കളി തുടങ്ങുക</button>
      <p id="login-status" class="status-text"></p>
    </div>
  </div>

  <!-- 2. GAME HUD & 3D CANVAS -->
  <div id="hud" style="display: none;">
    <span id="hud-player">Player: -</span>
    <span id="hud-door">Door: 1 / 5</span>
    <span id="hud-timer">Time: 0.0s</span>
  </div>

  <div id="game-canvas"></div>

  <!-- Mobile Touch Controls -->
  <div id="touch-controls">
    <button id="btn-up" type="button">▲</button>
    <div class="touch-row">
      <button id="btn-left" type="button">◀</button>
      <button id="btn-down" type="button">▼</button>
      <button id="btn-right" type="button">▶</button>
    </div>
  </div>

  <!-- 3. PUZZLE MODAL -->
  <div id="puzzle-modal" class="overlay-screen" style="display: none;">
    <div class="card">
      <h2 id="puzzle-title">Door Lock</h2>
      <p id="puzzle-question"></p>
      <input id="puzzle-answer" type="text" placeholder="ഉത്തരം നൽകുക" autocomplete="off" />
      <div class="btn-row">
        <button id="puzzle-submit-btn" type="button">അൺലോക്ക് ചെയ്യുക</button>
        <button id="puzzle-close-btn" type="button">അടയ്ക്കുക</button>
      </div>
      <p id="puzzle-feedback" class="status-text"></p>
    </div>
  </div>

  <!-- 4. WIN MODAL -->
  <div id="win-modal" class="overlay-screen" style="display: none;">
    <div class="card">
      <h2>ലക്ഷ്യം പൂർത്തിയായി!</h2>
      <p id="win-summary"></p>
      <p id="form-submit-status" class="status-text"></p>
      <button id="play-again-btn" type="button">വീണ്ടും കളിക്കുക</button>
    </div>
  </div>

  <script src="/game.js"></script>
</body>
</html>
