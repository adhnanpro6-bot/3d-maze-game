<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>25-Question Knowledge Quiz</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- ACCESS / START SCREEN -->
  <section id="access-screen" class="screen-card-wrap">
    <div class="quiz-card">
      <div class="pill">25 QUESTIONS • QUIZ MODE</div>
      <h1>Knowledge Quiz Challenge</h1>
      <p class="muted">25 ചോദ്യങ്ങൾക്ക് ഉത്തരം നൽകി നിങ്ങളുടെ സ്കോർ പരിശോധിക്കുക.</p>

      <label for="player-name">കളിക്കാരന്റെ പേര്</label>
      <input id="player-name" type="text" placeholder="നിങ്ങളുടെ പേര് നൽകുക" autocomplete="off" />

      <label for="access-code">ആക്സസ് കോഡ്</label>
      <input id="access-code" type="text" placeholder="ഉദാ: KKMQZN02-9153" autocomplete="off" />

      <button id="start-btn" type="button" class="btn primary">Quiz തുടങ്ങുക</button>
      <p id="login-status" class="status-text"></p>

      <details class="continue-box">
        <summary>ഉപയോഗിച്ച ആക്സസ് കോഡ് വഴി തുടരുക</summary>
        <div class="continue-row">
          <input id="continue-code-input" type="text" placeholder="ഉദാ: KKMQZN01-7842" autocomplete="off" />
          <button id="continue-btn" type="button" class="btn secondary">Continue</button>
        </div>
        <p id="continue-status" class="status-text"></p>
      </details>
    </div>
  </section>

  <!-- QUIZ SCREEN -->
  <main id="quiz-screen" class="screen-card-wrap" style="display: none;">
    <div class="quiz-card quiz-wide">
      <div class="quiz-topbar">
        <span id="hud-player">Player: -</span>
        <span id="hud-qnum">Question: 1 / 25</span>
        <span id="hud-score">Score: 0</span>
        <span id="hud-timer">Time: 20.0s</span>
      </div>

      <div class="q-meta">
        <span id="q-category" class="pill">GENERAL</span>
        <button id="hint-btn" type="button" class="btn hint">Hint (3 left)</button>
      </div>

      <h2 id="q-prompt" class="q-prompt"></h2>
      <div id="choices-list" class="choices-list"></div>

      <div id="feedback-panel" class="feedback-panel" style="display: none;">
        <div id="feedback-heading" class="feedback-heading"></div>
        <p id="feedback-text" class="feedback-text"></p>
        <button id="next-btn" type="button" class="btn primary">അടുത്ത ചോദ്യം</button>
      </div>
    </div>
  </main>

  <!-- RESULT SCREEN -->
  <section id="result-screen" class="screen-card-wrap" style="display: none;">
    <div class="quiz-card">
      <div class="pill">QUIZ COMPLETED</div>
      <h2>നിങ്ങളുടെ ഫലം</h2>
      <p id="result-summary" class="result-summary"></p>
      <p id="result-sync-status" class="status-text"></p>
      <button id="restart-btn" type="button" class="btn primary">വീണ്ടും ശ്രമിക്കുക</button>
    </div>
  </section>

  <script src="/game.js"></script>
</body>
</html>
