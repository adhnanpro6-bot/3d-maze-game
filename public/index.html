<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0705" />
  <title>Mars 10-Stage Maze Challenge</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 1. ACCESS GATE SCREEN -->
  <div id="access-screen" class="overlay-screen">
    <div class="card">
      <h1>MARS 10-STAGE MAZE</h1>
      <p class="subtitle">ചൊവ്വ ഗ്രഹത്തിലെ മൂലയിൽ നിന്ന് ആരംഭിച്ച് 10 Fun Stage Minigames പൂർത്തിയാക്കുക</p>

      <label for="player-name">കളിക്കാരന്റെ പേര്</label>
      <input id="player-name" type="text" placeholder="നിങ്ങളുടെ പേര് നൽകുക" autocomplete="off" />

      <label for="access-code">പുതിയ ആക്സസ് കോഡ്</label>
      <input id="access-code" type="text" placeholder="ഉദാ: KKMQZN02-9153" autocomplete="off" />

      <button id="start-btn" type="button">Mars ദൗത്യം തുടങ്ങുക</button>
      <p id="login-status" class="status-text"></p>

      <hr style="border:none;border-top:1px solid rgba(251,146,60,0.22);margin:16px 0;" />

      <label for="continue-code-input">ഇതിനകം ഉപയോഗിച്ച ആക്സസ് കോഡ് (Continue)</label>
      <input id="continue-code-input" type="text" placeholder="ഉദാ: KKMQZN01-7842" autocomplete="off" />
      <button id="continue-btn" type="button" style="width:100%;margin-top:10px;background:rgba(251,146,60,0.2);border:1px solid rgba(251,146,60,0.6);color:#ffedd5;">Continue Mission</button>
      <p id="continue-status" class="status-text"></p>
    </div>
  </div>

  <!-- 2. GAME HUD & 3D CANVAS -->
  <div id="hud" style="display: none;">
    <span id="hud-player">Player: -</span>
    <span id="hud-door">Stage: 1 / 10</span>
    <span id="hud-timer">Time: 0.0s</span>
  </div>

  <div id="game-canvas"></div>

  <!-- Large Mobile Touch Controls -->
  <div id="touch-controls">
    <button id="btn-up" type="button">▲</button>
    <div class="touch-row">
      <button id="btn-left" type="button">◀</button>
      <button id="btn-down" type="button">▼</button>
      <button id="btn-right" type="button">▶</button>
    </div>
  </div>

  <!-- 3. WIN MODAL -->
  <div id="win-modal" class="overlay-screen" style="display: none;">
    <div class="card">
      <h2>MARS MISSION COMPLETE!</h2>
      <p id="win-summary"></p>
      <p id="form-submit-status" class="status-text"></p>
      <button id="play-again-btn" type="button">വീണ്ടും കളിക്കുക</button>
    </div>
  </div>

  <script src="/game.js"></script>
</body>
</html>
