<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05070c" />
  <title>3D Maze Puzzle Challenge</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 1. ACCESS GATE SCREEN -->
  <div id="access-screen" class="overlay-screen">
    <div class="card">
      <h1>3D MAZE CHALLENGE</h1>
      <p class="subtitle">10 വാതിലുകൾ കടന്ന് Centre Fountain-ൽ എത്തുക</p>

      <label for="player-name">കളിക്കാരന്റെ പേര്</label>
      <input id="player-name" type="text" placeholder="നിങ്ങളുടെ പേര് നൽകുക" autocomplete="off" />

      <label for="access-code">പുതിയ ആക്സസ് കോഡ്</label>
      <input id="access-code" type="text" placeholder="ഉദാ: KKMQZN02-9153" autocomplete="off" />

      <button id="start-btn" type="button">കളി തുടങ്ങുക</button>
      <p id="login-status" class="status-text"></p>

      <hr style="border:none;border-top:1px solid rgba(255,255,255,0.12);margin:16px 0;" />

      <label for="continue-code-input">ഇതിനകം ഉപയോഗിച്ച ആക്സസ് കോഡ് (Continue Game)</label>
      <input id="continue-code-input" type="text" placeholder="ഉദാ: KKMQZN01-7842" autocomplete="off" />
      <button id="continue-btn" type="button" style="width:100%;margin-top:10px;background:rgba(59,130,246,0.22);border:1px solid rgba(96,165,250,0.55);color:#dbeafe;">Continue Game</button>
      <p id="continue-status" class="status-text"></p>
    </div>
  </div>

  <!-- 2. GAME HUD & 3D CANVAS -->
  <div id="hud" style="display: none;">
    <span id="hud-player">Player: -</span>
    <span id="hud-door">Active Door: 1 / 10</span>
    <span id="hud-timer">Time: 0.0s</span>
  </div>

  <div id="game-canvas"></div>

  <!-- Mobile Touch Controls -->
  <div id="touch-controls">
    <button id="btn-up" type="button">▲</button>
    <div class="touch-row">
      <button id="btn-left" type="button">◀</button>
      <button id="btn-down" type="button">▼</button>
      <button id="btn-right" type="button">▶</button>
    </div>
  </div>

  <!-- 4. WIN MODAL -->
  <div id="win-modal" class="overlay-screen" style="display: none;">
    <div class="card">
      <h2>ലക്ഷ്യം പൂർത്തിയായി!</h2>
      <p id="win-summary"></p>
      <p id="form-submit-status" class="status-text"></p>
      <button id="play-again-btn" type="button">വീണ്ടും കളിക്കുക</button>
    </div>
  </div>

  <script src="/game.js"></script>
</body>
</html>
